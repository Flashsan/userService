databaseChangeLog:
  - changeSet:
      id: 001-init-users-table
      author: Aliaksandr Hryharovich
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                name: id
                type: bigint
                autoIncrement: true
                constraints:
                  primaryKey: true
                  nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(100)
              - column:
                  name: last_name
                  type: varchar(100)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: NOW()
