spring:
  application:
    name: userService

  datasource:
    url: jdbc:postgresql://localhost:5432/user_service_db
    username: postgres
    password: secret
    driver-class_name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    contexts: dev, prod
    default-schema: public
